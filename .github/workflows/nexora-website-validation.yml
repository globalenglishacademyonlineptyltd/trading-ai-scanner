name: NEXORA website validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server.js"
      - "public/**"
      - "mt5/**"
      - ".github/workflows/nexora-website-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
      - name: Smoke-test website server without broker credentials
        run: |
          PORT=8787 node server.js >/tmp/nexora-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/nexora-health.json; then
              break
            fi
            sleep 1
          done
          node --input-type=module -e "import fs from 'node:fs'; const health=JSON.parse(fs.readFileSync('/tmp/nexora-health.json','utf8')); if(health.ok!==true || health.service!=='NEXORA AI') process.exit(1); console.log('NEXORA health endpoint passed.');"
      - name: Verify safety and intelligence invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const server = fs.readFileSync('server.js', 'utf8');
          const app = fs.readFileSync('public/app.js', 'utf8');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const ea = fs.readFileSync('mt5/NEXORA_Trading_EA.mq5', 'utf8');
          assert.match(server, /NEWS_REFRESH_INTERVAL_MS\s*=\s*2\s*\*\s*60\s*\*\s*60\s*\*\s*1000/);
          assert.match(server, /SCAN_INTERVAL_MS\s*=\s*Math\.max\(120000, Number\(process\.env\.NEXORA_SCAN_INTERVAL_MS\) \|\| 120000\)/);
          assert.match(server, /function analyseVolume\(/);
          assert.match(server, /relatedHeadlines/);
          assert.match(server, /automaticTradingEnabled\s*=\s*false/);
          assert.match(server, /function assertAutomaticExecutionAllowed\(\)\s*\{\s*throw new Error/);
          assert.equal((app.match(/let newsAutoRefreshTimer/g) || []).length, 1);
          assert.equal((app.match(/const NEWS_AUTO_REFRESH_MS/g) || []).length, 1);
          assert.match(html, /id="marketCatalysts"/);
          assert.match(html, /Signal refresh: every 2 minutes/);
          assert.match(ea, /InpEnableAutoExecution\s*=\s*false/);
          assert.match(ea, /InpRiskPerTradePercent\s*=\s*1\.0/);
          assert.match(ea, /InpMaxAccountRiskPercent\s*=\s*3\.0/);
          assert.match(ea, /InpMaxOpenPositions\s*=\s*3/);
          assert.match(ea, /InpPollSeconds\s*=\s*120/);
          assert.match(ea, /OrderCalcProfit\(/);
          assert.match(ea, /CalculateExistingAccountRisk\(/);
          assert.doesNotMatch(ea, /InpFixedLots/);
          assert.match(ea, /SymbolsTotal\(true\)/);
          assert.match(ea, /InpAnalysisTimeframe\s*=\s*PERIOD_CURRENT/);
          assert.match(ea, /ManageTrailingStop\(\)/);
          assert.match(ea, /trade\.PositionModify\(ticket/);
          assert.match(app, /setInterval\(refreshLiveScan,120000\)/);
          console.log('NEXORA website safety and intelligence invariants passed.');
          NODE
